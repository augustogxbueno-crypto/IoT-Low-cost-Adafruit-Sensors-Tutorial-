lib_deps =
    ${common.common_lib_deps}
    adafruit/Adafruit AS7343
build_src_filter = +<*> -<sensors/> +<sensors/AS7343.cpp>

; =============================================================================
; AS7262 — 6 channels, discrete LED (4 fixed current levels), linear formula
; =============================================================================
[env:as7262_esp32s3]
extends = board_esp32s3
build_flags = ${board_esp32s3.build_flags} -D SENSOR_AS7262
lib_deps =
    ${common.common_lib_deps}
